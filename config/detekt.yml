# Mihomet detekt config (audit P2.7) — intentionally minimal.
#
# Only structural size limits, unused imports and the exceptions ruleset are
# active; everything else is noise for this codebase at its current size.
# Pre-existing violations are frozen in config/detekt-baseline.xml, so only
# NEW violations fail the build.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

comments:
  active: false

complexity:
  active: false
  LongMethod:
    active: true
    # ~100 lines of code ≈ 150 statements; generous by design (P2.7).
    threshold: 150
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: ['Inject']
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    thresholdInEnums: 20
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  LargeClass:
    active: true
    # ~700+ lines of code ≈ 1200 statements (P2.7 target: files ≤ 700 lines).
    threshold: 1200
  NestedBlockDepth:
    active: true
    threshold: 7

coroutines:
  active: false

empty-blocks:
  active: false

exceptions:
  active: true

naming:
  active: false

performance:
  active: false

potential-bugs:
  active: false

style:
  active: true
  # Only UnusedImports is wanted from style (audit P2.7: "no style rules").
  # Every other default-active style rule is switched off explicitly — a
  # ruleset-level `active: false` wins over per-rule `active: true`, so this
  # opt-out list is the only way to keep UnusedImports alone. Regenerate with
  # the default-detekt-config.yml of the pinned detekt version when bumping.
  UnusedImports:
    active: true
  CascadingCallWrapping:
    active: false
  ClassOrdering:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  EqualsNullCall:
    active: false
  ExplicitItLambdaParameter:
    active: false
  ExpressionBodySyntax:
    active: false
  ForbiddenAnnotation:
    active: false
  ForbiddenComment:
    active: false
  ForbiddenImport:
    active: false
  ForbiddenMethodCall:
    active: false
  ForbiddenSuppress:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MandatoryBracesLoops:
    active: false
  MaxLineLength:
    active: false
  MayBeConst:
    active: false
  ModifierOrder:
    active: false
  NestedClassesVisibility:
    active: false
  NewLineAtEndOfFile:
    active: false
  ObjectLiteralToLambda:
    active: false
  OptionalAbstractKeyword:
    active: false
  OptionalUnit:
    active: false
  ProtectedMemberInFinalClass:
    active: false
  RedundantHigherOrderMapUsage:
    active: false
  ReturnCount:
    active: false
  SafeCast:
    active: false
  SerialVersionUIDInSerializableClass:
    active: false
  SpacingBetweenPackageAndImports:
    active: false
  ThrowsCount:
    active: false
  UnnecessaryAbstractClass:
    active: false
  UnnecessaryApply:
    active: false
  UnnecessaryFilter:
    active: false
  UnnecessaryInheritance:
    active: false
  UnnecessaryParentheses:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateClass:
    active: false
  UnusedPrivateMember:
    active: false
  UnusedPrivateProperty:
    active: false
  UseAnyOrNoneInsteadOfFind:
    active: false
  UseArrayLiteralsInAnnotations:
    active: false
  UseCheckNotNull:
    active: false
  UseCheckOrError:
    active: false
  UseDataClass:
    active: false
  UseIsNullOrEmpty:
    active: false
  UseOrEmpty:
    active: false
  UseRequire:
    active: false
  UseRequireNotNull:
    active: false
  UselessCallOnNotNull:
    active: false
  UtilityClassWithPublicConstructor:
    active: false
  VarCouldBeVal:
    active: false
  WildcardImport:
    active: false
