# Pinned Mihomo core artifacts for the downloadMihomoCore Gradle task.
#
# This is NOT the stock MetaCubeX release: it is mihomo v1.19.33 patched for
# non-root TUN (stock core dies with "build android rules: read packages list:
# permission denied" because sing-tun reads /data/system/packages.xml).
#   patch:  core-patch/mihomo-android-nonroot.patch (idea: Tropa, GPL-3.0)
#   build:  core-build/build-core.sh (docker golang:1.23 + Android NDK r29,
#           CGO_ENABLED=1, -tags with_gvisor, -trimpath, version stamped
#           v1.19.33-mihomet.1)
# Artifacts are raw (non-gzip) libmihomo-<abi>.so published at
#   https://github.com/mihomet/mihomet/releases/tag/<version>
# checksum.* = sha256 of the unpacked .so; size.* = its exact byte size.
# GPL-3.0 source offer: the complete corresponding source of the bundled GPL
# core is this repository (core-patch/ + core-build/).
# Core binaries are executed on-device (incl. as root) — never bump without
# verifying the release artifacts.
# Geo databases track the rolling "latest" of MetaCubeX/meta-rules-dat (no checksum pin).
