<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Variant 8 "Layers": isometric M stack — three tunnel planes in depth -->
  <rect width="512" height="512" rx="115" fill="#17131F"/>
  <!-- back plane (dim) -->
  <path d="M164 210 L216 150 L256 246 L296 150 L348 210"
        fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- middle plane -->
  <path d="M148 250 L204 184 L256 292 L308 184 L364 250"
        fill="none" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- front plane (bright) -->
  <path d="M132 296 L192 220 L256 340 L320 220 L380 296"
        fill="none" stroke="#DDD6FE" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="132" cy="296" r="22" fill="#2DD4BF"/>
  <circle cx="380" cy="296" r="22" fill="#F472B6"/>
</svg>
