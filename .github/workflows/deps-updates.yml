name: Dependency updates report

# Audit P2.4: weekly freshness check. Report-only on purpose — no failure gate,
# so a new library release can never red the build; it just surfaces in the
# artifact and the job summary for a human to action through the staged
# dependency ladder (see AGENTS.md §3 key facts).

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-updates:
    name: dependencyUpdates report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # --refresh-dependencies forces re-checking metadata so the report never
      # runs on stale cached versions.
      - name: Generate dependency updates report
        run: ./gradlew dependencyUpdates --refresh-dependencies --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Summarize report
        run: |
          {
            echo "## Outdated dependencies (ben-manes versions plugin)"
            echo '```'
            sed -n '/The following dependencies have later milestone versions:/,/^$/p' \
              build/dependencyUpdates/report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-updates-report
          path: |
            build/dependencyUpdates/report.txt
            build/dependencyUpdates/report.json
          if-no-files-found: warn
          retention-days: 30
